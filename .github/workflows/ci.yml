name: CI

# deployment.md "Build and release pipeline": every push runs style, static
# analysis and the test suite; a release tag additionally builds the image.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Style, PHPStan L8, Pest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: klinikform_test
          POSTGRES_USER: simrs
          POSTGRES_PASSWORD: simrs_secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U simrs -d klinikform_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, dom, xml, curl, zip, redis, pcov
          coverage: pcov
          tools: composer:v2

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Generate application key
        run: php artisan key:generate --force
        env:
          BLIND_INDEX_PEPPER: ci-pepper
          FAPI_TOKEN: ci-fapi-token

      - name: Laravel Pint (PSR-12)
        run: vendor/bin/pint --test

      - name: PHPStan level 8
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Build frontend assets
        run: npm run build

      - name: Run test suite
        # The Browser suite drives a real Chrome against a served app and runs
        # in its own job below.
        run: vendor/bin/pest --testsuite=Unit,Feature --coverage --min=90
        env:
          BLIND_INDEX_PEPPER: ci-pepper
          FAPI_TOKEN: ci-fapi-token

      - name: Dependency vulnerability scan
        run: |
          composer audit --no-interaction
          npm audit --audit-level=high

  dusk:
    name: End-to-end (Dusk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, pgsql, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci
          npm run build

      - name: Install PostgreSQL and Redis
        run: |
          sudo systemctl start postgresql.service
          sudo systemctl start redis-server.service

      - name: Generate application key
        run: php artisan key:generate --force
        env:
          BLIND_INDEX_PEPPER: ci-pepper
          FAPI_TOKEN: ci-fapi-token

      - name: Start Chrome driver
        uses: php-webdriver/dusk-chrome-driver-action@v1

      - name: Run browser tests
        run: php artisan dusk
        env:
          APP_URL: http://127.0.0.1:8000
          DB_HOST: 127.0.0.1
          REDIS_HOST: 127.0.0.1
          BLIND_INDEX_PEPPER: ci-pepper
          FAPI_TOKEN: ci-fapi-token

  image:
    name: Build container image
    needs: [test, dusk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile --target base -t klinikform-simrs:${{ github.ref_name }} .