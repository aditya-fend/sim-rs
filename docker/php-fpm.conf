; KlinikForm SIMRS — deployment.md §5.
;
; NFR-03 requires the FHIR read endpoints to answer in <250 ms at a
; concurrency of 50. Each PHP-FPM worker serves one request at a time, so the
; pool is sized above the expected concurrent load rather than left at the
; packaged default of 5, which queues at 50 VUs.
[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

pm = static
pm.max_children = 32
pm.max_requests = 500

; A clinical record read is small; a webhook delivery or a PDF export is not.
request_terminate_timeout = 30s
php_admin_value[memory_limit] = 256M
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no
