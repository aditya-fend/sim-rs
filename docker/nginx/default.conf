upstream klinikform_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    # deployment.md: TLS 1.3 terminates upstream of this proxy in production.
    # Local development reaches the app over plain HTTP on :8080.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass klinikform_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(css|js|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}