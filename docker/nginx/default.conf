upstream klinikform_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # deployment.md: TLS 1.3 terminates upstream of this proxy in production.
    # Local development reaches the app over plain HTTP on :8080.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 8m;

    # The container runs `php artisan serve`, which speaks plain HTTP rather
    # than FastCGI, so this is a reverse proxy rather than a php-fpm vhost.
    # The production image swaps `artisan serve` for php-fpm and this block for
    # the fastcgi_pass variant.
    location / {
        proxy_pass http://klinikform_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}